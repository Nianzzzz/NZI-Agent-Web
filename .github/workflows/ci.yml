name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, feature/*]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @nzi/shared-types build
      - run: pnpm --filter @nzi/backend build
      - run: pnpm --filter @nzi/frontend build
